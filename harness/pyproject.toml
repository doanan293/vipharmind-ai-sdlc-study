[project]
name = "sdlc-harness"
version = "0.1.0"
description = "Replays ViPharmind feature commits as tasks for AI coding agents and grades them with hidden tests"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
sdlc-harness = "sdlc_harness.cli:main"

[dependency-groups]
dev = ["pytest", "radon", "coverage", "ruff", "pyrefly"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sdlc_harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
