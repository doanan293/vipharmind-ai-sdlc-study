# Run cohorts: one agent CLI + model each; every cohort runs at medium effort.
# accounts are indices into accounts.local.toml (never emails or tokens); a cohort switches
# to its next account when the current one runs out of quota.
# Pilot (Task 9): claude and agy run direct on one subscription login each; codex account 1 is
# the local cli-proxy-api, which itself round-robins over its codex logins (docs/pilot-report.md).

[cohort.claude-sonnet]
agent = "claude"
model = "claude-sonnet-5-5"
effort = "medium"
accounts = [1]

[cohort.claude-opus]
agent = "claude"
model = "claude-opus-5-5"
effort = "medium"
accounts = [1]

[cohort.agy-gemini]
agent = "agy"
model = "gemini-3.8-flash-medium"
effort = "medium"
accounts = [1]

[cohort.codex-luna]
agent = "codex"
model = "gpt-6-luna"
effort = "medium"
accounts = [1]
