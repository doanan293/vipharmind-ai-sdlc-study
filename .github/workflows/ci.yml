name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python (every project with a pyproject.toml)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.13"
      - name: Lint and test each project
        run: |
          found=0
          for pyproject in */pyproject.toml; do
            [ -e "$pyproject" ] || continue
            dir=$(dirname "$pyproject")
            found=1
            echo "::group::${dir}"
            (cd "$dir" && uv sync --locked && uv run ruff check . && uv run ruff format --check . && uv run pytest -q)
            echo "::endgroup::"
          done
          [ "$found" -eq 1 ] || echo "No Python project yet."

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Gitleaks
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks git --no-banner -v --exit-code 1
