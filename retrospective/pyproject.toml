[project]
name = "retro"
version = "0.1.0"
description = "Retrospective analysis of the ViPharmind history (RQ1, RQ2)"
requires-python = ">=3.12"
dependencies = ["matplotlib>=3.9"]

[project.scripts]
retro = "retro.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/retro"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["real: needs the local ViPharmind repo at the pinned commits (skipped otherwise)"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
