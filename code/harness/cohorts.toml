# Run cohorts: one agent CLI + model each; every cohort runs at medium effort.
# accounts are indices into accounts.local.toml (never emails or tokens); a cohort switches
# to its next account when the current one runs out of quota.
# Main runs (ruling R11, owner 2026-11-15): claude runs direct on one subscription login; agy
# rotates over its direct logins (1 = ~/.gemini, 2-4 converted from the owner's proxy logins);
# codex rotates over its direct logins (1 = ~/.codex, 2-4 converted). No proxy for any agent.

[cohort.claude-sonnet]
agent = "claude"
model = "claude-sonnet-5-5"
effort = "medium"
accounts = [1]

[cohort.claude-opus]
agent = "claude"
model = "claude-opus-5-5"
effort = "medium"
accounts = [1]

# Added in prereg-v1.2 (exploratory): the smaller Claude model, same CLI and account.
[cohort.claude-haiku]
agent = "claude"
model = "claude-haiku-5-5"
effort = "medium"
accounts = [1]

[cohort.agy-gemini]
agent = "agy"
model = "gemini-3.8-flash-medium"
effort = "medium"
accounts = [1, 2, 3, 4]

[cohort.codex-luna]
agent = "codex"
model = "gpt-6-luna"
effort = "medium"
accounts = [1, 2, 3, 4]
