[project]
name = "sdlc-analysis"
version = "0.1.0"
description = "Preregistered analysis (prereg-v1, section 9) of the spec-vs-vibe experiment results"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",
    "scipy",
    "statsmodels",
    "matplotlib",
]

[project.scripts]
sdlc-analysis = "sdlc_analysis.cli:main"

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sdlc_analysis"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
