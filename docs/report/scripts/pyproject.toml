[project]
name = "report-data"
version = "0.1.0"
description = "Sinh macro số liệu, bảng và hình cho báo cáo từ file kết quả"
requires-python = ">=3.12"
dependencies = ["matplotlib>=3.9"]

[project.scripts]
report-data = "report_data.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/report_data"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
